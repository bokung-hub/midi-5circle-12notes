<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印第安音律工坊 - MIDI 音階圓盤示波器</title>
    <style>
        :root {
            --bg-earth: #1b1512;
            --clay-red: #8b3a2b;
            --warm-sand: #e6c594;
            --turquoise: #2a8b8b;
            --gold-amber: #d49a37;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Noto Serif TC", "Segoe UI", serif;
            color: var(--warm-sand);
            background-color: var(--bg-earth);
            /* 印第安幾何圖騰背景圖 (SVG Data URI) */
            background-image: 
                radial-gradient(circle at center, rgba(139, 58, 43, 0.25) 0%, transparent 70%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60"><path d="M30 0 L60 30 L30 60 L0 30 Z" fill="none" stroke="%238b3a2b" stroke-width="1" opacity="0.2"/><path d="M30 10 L50 30 L30 50 L10 30 Z" fill="none" stroke="%23d49a37" stroke-width="0.8" opacity="0.25"/><circle cx="30" cy="30" r="3" fill="%232a8b8b" opacity="0.3"/></svg>');
            background-repeat: repeat;
        }

        .portal-container {
            width: 90%;
            max-width: 500px;
            padding: 40px 30px;
            background: rgba(27, 21, 18, 0.85);
            border: 2px solid var(--gold-amber);
            box-shadow: 0 0 25px rgba(139, 58, 43, 0.5), inset 0 0 15px rgba(212, 154, 55, 0.2);
            text-align: center;
            position: relative;
        }

        /* 頂部印第安部落圖騰裝飾條 */
        .portal-container::before {
            content: "";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 10px;
            background: linear-gradient(90deg, transparent, var(--turquoise), var(--gold-amber), var(--clay-red), transparent);
            clip-path: polygon(0 0, 10% 100%, 20% 0, 30% 100%, 40% 0, 50% 100%, 60% 0, 70% 100%, 80% 0, 90% 100%, 100% 0);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--gold-amber);
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px #000;
        }

        .card-link {
            display: block;
            text-decoration: none;
            color: var(--warm-sand);
            background: linear-gradient(135deg, rgba(139, 58, 43, 0.4), rgba(42, 139, 139, 0.2));
            padding: 22px 20px;
            border: 1px solid var(--turquoise);
            border-radius: 4px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card-link:hover {
            transform: translateY(-3px);
            border-color: var(--gold-amber);
            box-shadow: 0 8px 20px rgba(212, 154, 55, 0.3);
            background: linear-gradient(135deg, rgba(139, 58, 43, 0.7), rgba(42, 139, 139, 0.4));
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .symbol {
            margin-bottom: 8px;
            font-size: 1.5rem;
            color: var(--gold-amber);
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <h1>◆ 印第安音律儀式 ◆</h1>
        
        <a href="midi_circles7.html" class="card-link">
            <div class="symbol">🪶 ⚙️ 🪶</div>
            <div class="card-title">MIDI 音階圓盤示波器</div>
        </a>
    </div>

</body>
</html>
