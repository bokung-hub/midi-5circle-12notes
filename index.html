<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDI 音階連線示波器 - Lakota Lullaby4.mid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0d17;
      color: #e0e6ed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      width: 100%;
      max-width: 980px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #00d2ff, #0088ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .header-btns {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #182030;
      border: 1px solid #2e3c54;
      color: #b0c2de;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #233047;
      color: #ffffff;
      border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
    }
    .btn.active {
      background: #00a3e0;
      border-color: #ffffff;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(0, 163, 224, 0.4);
    }
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    
    /* 核心舞台 Container */
    .app-card {
      width: 100%;
      max-width: 980px;
      background: #111625;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
      border: 1px solid #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      background: #090c14;
      border-radius: 12px;
      border: 1px solid #1a2336;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 播放器控制器欄位 */
    .player-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #161d2f;
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid #232f48;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .ctrl-btns {
      display: flex;
      gap: 10px;
    }

    .btn-ctrl {
      background: #202b42;
      border: 1px solid #364868;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-ctrl:hover {
      background: #00d2ff;
      color: #000;
      font-weight: bold;
    }

    /* 時間與進度條 */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .time-display {
      font-family: monospace;
      font-size: 0.85rem;
      color: #8fa0bc;
      min-width: 45px;
    }

    .progress-bar-wrapper {
      flex: 1;
      height: 8px;
      background: #0b0f19;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid #24314a;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d2ff, #ff0096);
      border-radius: 4px;
      transition: width 0.1s linear;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      color: #8e9bb0;
      font-size: 0.85rem;
      padding: 0 5px;
    }
  </style>
  <!-- MIDI 解析與 Sound Engine 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.min.js"></script>
</head>
<body>

  <header>
    <h1>MIDI Scale Circle Visualizer</h1>
    <div class="header-btns">
      <button id="btnMode1" class="btn active" onclick="switchMode(1)">
        <span>即時播放頁面</span>
      </button>
      <button id="btnMode2" class="btn" onclick="switchMode(2)">
        <span>全曲幾何頁面</span>
      </button>
    </div>
  </header>

  <main class="app-card">
    <div class="canvas-container">
      <canvas id="visualizer" width="940" height="500"></canvas>
    </div>

    <div class="player-controls">
      <div class="progress-container">
        <span id="currentTime" class="time-display">00:00</span>
        <div class="progress-bar-wrapper" id="progressBar" onclick="seekProgress(event)">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <span id="totalTime" class="time-display">00:00</span>
      </div>

      <div class="control-row">
        <div class="ctrl-btns">
          <button class="btn-ctrl" id="btnPlay" onclick="togglePlay()">► 播放</button>
          <button class="btn-ctrl" onclick="replayMIDI()">↺ 重播 (從頭)</button>
        </div>

        <div class="file-input-wrapper btn">
          <span>📁 選取本機 .mid 檔案</span>
          <input type="file" id="fileInput" accept=".mid,.midi" onchange="loadLocalFile(event)">
        </div>
      </div>
    </div>

    <div class="status-bar">
      <span id="fileStatus">目前檔案: Lakota Lullaby4.mid</span>
      <span id="noteStatus">當前音符: --</span>
    </div>
  </main>

  <script>
    // 固定 12 半音階名稱 (規定皆使用升記號)
    const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    // 五度圈相對索引順序
    const circleOfFifths = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5];

    let canvas, ctx;
    let currentMode = 1; // 1: 即時播放, 2: 全曲累積幾何
    let isPlaying = false;

    // MIDI 數據與狀態
    let midiData = null;
    let noteEvents = [];
    let songDuration = 0;
    let transitionMatrix = Array.from({ length: 12 }, () => Array(12).fill(0));
    let maxTransitionCount = 1;

    let lastNote = -1;
    let currentNote = -1;
    let currentNoteName = "--";

    // Web Audio 音訊播放器設定
    let audioCtx = null;
    let startTime = 0;
    let currentTimeOffset = 0;
    let activeOscillators = [];
    let animationFrameId = null;

    window.onload = () => {
      canvas = document.getElementById('visualizer');
      ctx = canvas.getContext('2d');
      
      // 啟動渲染迴圈
      requestAnimationFrame(drawLoop);

      // 嘗試自動載入預設檔案
      fetchMidiFile('Lakota Lullaby4.mid');
    };

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnMode1').classList.toggle('active', mode === 1);
      document.getElementById('btnMode2').classList.toggle('active', mode === 2);
    }

    function fetchMidiFile(filename) {
      fetch(filename)
        .then(res => {
          if (!res.ok) throw new Error('File not found');
          return res.arrayBuffer();
        })
        .then(buffer => parseMidiBuffer(buffer, filename))
        .catch(err => {
          console.warn('無法預設載入檔案，等待使用者手動選取:', err);
          document.getElementById('fileStatus').innerText = "提示：請點擊『選取本機 .mid 檔案』載入 Lakota Lullaby4.mid";
        });
    }

    function loadLocalFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        parseMidiBuffer(e.target.result, file.name);
      };
      reader.readAsArrayBuffer(file);
    }

    function parseMidiBuffer(arrayBuffer, filename) {
      stopPlayback();

      const midi = new Midi(arrayBuffer);
      midiData = midi;
      songDuration = midi.duration || 0;

      document.getElementById('fileStatus').innerText = `目前檔案: ${filename}`;
      document.getElementById('totalTime').innerText = formatTime(songDuration);

      // 解析所有 音符 事件
      noteEvents = [];
      transitionMatrix = Array.from({ length: 12 }, () => Array(12).fill(0));
      maxTransitionCount = 1;

      let prevPitch = -1;

      midi.tracks.forEach(track => {
        track.notes.forEach(note => {
          noteEvents.push({
            time: note.time,
            duration: note.duration,
            midi: note.midi,
            pitch: note.midi % 12,
            velocity: note.velocity
          });
        });
      });

      // 依時間順序排序
      noteEvents.sort((a, b) => a.time - b.time);

      // 統計全曲音階過渡矩陣
      noteEvents.forEach(note => {
        const pitch = note.pitch;
        if (prevPitch >= 0 && prevPitch !== pitch) {
          transitionMatrix[prevPitch][pitch]++;
          if (transitionMatrix[prevPitch][pitch] > maxTransitionCount) {
            maxTransitionCount = transitionMatrix[prevPitch][pitch];
          }
        }
        prevPitch = pitch;
      });

      // 重設至開頭並自動開始播放
      currentTimeOffset = 0;
      playMIDI();
    }

    function togglePlay() {
      if (!midiData) return;
      if (isPlaying) {
        pauseMIDI();
      } else {
        playMIDI();
      }
    }

    function playMIDI() {
      if (!midiData) return;
      initAudioContext();

      // 如果已經播到結尾，從頭開始
      if (currentTimeOffset >= songDuration) {
        currentTimeOffset = 0;
      }

      isPlaying = true;
      startTime = audioCtx.currentTime - currentTimeOffset;
      document.getElementById('btnPlay').innerText = "❚❚ 暫停";
    }

    function pauseMIDI() {
      if (!isPlaying) return;
      isPlaying = false;
      document.getElementById('btnPlay').innerText = "► 播放";
      stopActiveNotes();
    }

    function replayMIDI() {
      if (!midiData) return;
      stopActiveNotes();
      currentTimeOffset = 0;
      lastNote = -1;
      currentNote = -1;
      currentNoteName = "--";
      document.getElementById('noteStatus').innerText = "當前音符: --";

      if (!isPlaying) {
        playMIDI();
      } else {
        startTime = audioCtx.currentTime;
      }
    }

    function stopPlayback() {
      isPlaying = false;
      document.getElementById('btnPlay').innerText = "► 播放";
      currentTimeOffset = 0;
      lastNote = -1;
      currentNote = -1;
      currentNoteName = "--";
      document.getElementById('noteStatus').innerText = "當前音符: --";
      document.getElementById('progressFill').style.width = "0%";
      document.getElementById('currentTime').innerText = "00:00";
      stopActiveNotes();
    }

    function stopActiveNotes() {
      activeOscillators.forEach(item => {
        try { item.osc.stop(); } catch(e){}
      });
      activeOscillators = [];
    }

    function seekProgress(event) {
      if (!midiData) return;
      const rect = event.currentTarget.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));

      stopActiveNotes();
      currentTimeOffset = ratio * songDuration;
      
      if (isPlaying) {
        startTime = audioCtx.currentTime - currentTimeOffset;
      } else {
        updatePlaybackUI(currentTimeOffset);
      }
    }

    function drawLoop() {
      if (isPlaying && audioCtx) {
        currentTimeOffset = audioCtx.currentTime - startTime;

        // 當曲子播放結束時：自動重設並停在結尾，可再次點擊播放
        if (currentTimeOffset >= songDuration) {
          currentTimeOffset = songDuration;
          pauseMIDI();
          currentNote = -1;
          lastNote = -1;
          currentNoteName = "--";
          document.getElementById('noteStatus').innerText = "當前音符: -- (播放完畢)";
        } else {
          // 處理當前時間軸對應的音符發聲與視覺化
          processAudioAndVisuals(currentTimeOffset);
        }

        updatePlaybackUI(currentTimeOffset);
      }

      // 執行 Canvas 畫布渲染
      renderCanvas();
      requestAnimationFrame(drawLoop);
    }

    function processAudioAndVisuals(time) {
      // 尋找當前毫秒內彈奏的音符
      const windowSize = 0.08; 
      
      noteEvents.forEach(note => {
        // 發聲觸發
        if (note.time >= time && note.time < time + windowSize) {
          if (!note.played) {
            note.played = true;
            playTone(note.midi, note.duration, note.velocity);
          }
        } else if (note.time < time - 0.2) {
          note.played = false; // 重設標記以便重播
        }

        // 視覺亮燈觸發 (近時性)
        if (time >= note.time && time < note.time + note.duration + 0.1) {
          if (currentNote !== note.pitch) {
            lastNote = currentNote;
            currentNote = note.pitch;
            currentNoteName = `${noteNames[currentNote]} (MIDI: ${note.midi})`;
            document.getElementById('noteStatus').innerText = `當前音符: ${currentNoteName}`;
          }
        }
      });
    }

    function playTone(midiPitch, duration, velocity) {
      const freq = 440 * Math.pow(2, (midiPitch - 69) / 12);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      const vol = Math.max(0.01, velocity * 0.15);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + Math.min(duration, 1.5));

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + Math.min(duration, 1.5));

      activeOscillators.push({ osc, endTime: audioCtx.currentTime + duration });
    }

    function updatePlaybackUI(time) {
      document.getElementById('currentTime').innerText = formatTime(time);
      if (songDuration > 0) {
        const pct = Math.min(100, (time / songDuration) * 100);
        document.getElementById('progressFill').style.width = `${pct}%`;
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function renderCanvas() {
      ctx.fillStyle = '#090c14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentMode === 1) {
        // 頁面 1: 即時動態連線
        drawDisc(230, 250, 145, false, '#00d2ff');
        drawDisc(710, 250, 145, true, '#ff0096');
      } else {
        // 頁面 2: 全曲軌跡累積
        drawAllConnectionsDisc(230, 250, 145, false, '#00d2ff');
        drawAllConnectionsDisc(710, 250, 145, true, '#ff0096');
      }
    }

    // 繪製【頁面 1：即時播放圓盤】
    function drawDisc(cx, cy, r, isFifths, themeColor) {
      ctx.save();
      ctx.translate(cx, cy);

      // 標題
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '600 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isFifths ? 'Circle of Fifths (即時動態)' : '12-Equal Temperament (即時動態)', 0, -r - 35);

      // 外圈發光底圓
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 12 音階節點點位
      for (let i = 0; i < 12; i++) {
        const angle = (i * Math.PI * 2 / 12) - Math.PI / 2;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;

        const noteIdx = isFifths ? circleOfFifths[i] : i;
        const isActive = (currentNote >= 0 && noteIdx === currentNote);

        ctx.beginPath();
        if (isActive) {
          ctx.arc(x, y, 18, 0, Math.PI * 2);
          ctx.fillStyle = themeColor;
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.shadowColor = themeColor;
          ctx.shadowBlur = 15;
          ctx.stroke();

          ctx.fillStyle = '#000000';
          ctx.font = 'bold 14px sans-serif';
        } else {
          ctx.arc(x, y, 14, 0, Math.PI * 2);
          ctx.fillStyle = '#111827';
          ctx.fill();
          ctx.strokeStyle = themeColor;
          ctx.lineWidth = 1.5;
          ctx.shadowBlur = 0;
          ctx.stroke();

          ctx.fillStyle = '#9ca3af';
          ctx.font = '12px sans-serif';
        }
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(noteNames[noteIdx], x, y);
      }

      // 繪製即時發音轉換連線
      if (lastNote >= 0 && currentNote >= 0 && lastNote !== currentNote) {
        const pos1 = isFifths ? getFifthsPos(lastNote) : lastNote;
        const pos2 = isFifths ? getFifthsPos(currentNote) : currentNote;

        const a1 = (pos1 * Math.PI * 2 / 12) - Math.PI / 2;
        const a2 = (pos2 * Math.PI * 2 / 12) - Math.PI / 2;

        ctx.beginPath();
        ctx.moveTo(Math.cos(a1) * r, Math.sin(a1) * r);
        ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r);
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 4;
        ctx.shadowColor = themeColor;
        ctx.shadowBlur = 12;
        ctx.stroke();
      }

      ctx.restore();
    }

    // 繪製【頁面 2：全曲累積軌跡圓盤】
    function drawAllConnectionsDisc(cx, cy, r, isFifths, themeColor) {
      ctx.save();
      ctx.translate(cx, cy);

      // 標題
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '600 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isFifths ? 'Circle of Fifths (全曲軌跡)' : '12-Equal Temperament (全曲軌跡)', 0, -r - 35);

      // 外圈底圓
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 畫出全曲所有累積連線
      for (let fromNote = 0; fromNote < 12; fromNote++) {
        for (let toNote = 0; toNote < 12; toNote++) {
          const count = transitionMatrix[fromNote][toNote];
          if (count > 0 && fromNote !== toNote) {
            const pos1 = isFifths ? getFifthsPos(fromNote) : fromNote;
            const pos2 = isFifths ? getFifthsPos(toNote) : toNote;

            const a1 = (pos1 * Math.PI * 2 / 12) - Math.PI / 2;
            const a2 = (pos2 * Math.PI * 2 / 12) - Math.PI / 2;

            const weight = 1 + (count / maxTransitionCount) * 4;
            const alpha = 0.25 + (count / maxTransitionCount) * 0.75;

            ctx.beginPath();
            ctx.moveTo(Math.cos(a1) * r, Math.sin(a1) * r);
            ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r);
            ctx.strokeStyle = hexToRgba(themeColor, alpha);
            ctx.lineWidth = weight;
            ctx.stroke();
          }
        }
      }

      // 音階節點點位
      for (let i = 0; i < 12; i++) {
        const angle = (i * Math.PI * 2 / 12) - Math.PI / 2;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;

        const noteIdx = isFifths ? circleOfFifths[i] : i;

        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fillStyle = '#111827';
        ctx.fill();
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#f3f4f6';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(noteNames[noteIdx], x, y);
      }

      ctx.restore();
    }

    function getFifthsPos(noteVal) {
      return circleOfFifths.indexOf(noteVal);
    }

    function hexToRgba(hex, alpha) {
      let c = hex.replace('#', '');
      if (c.length === 3) {
        c = c.split('').map(x => x + x).join('');
      }
      const num = parseInt(c, 16);
      return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
    }
  </script>
</body>
</html>
